<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot SaaS Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#eee;padding:20px;max-width:600px;margin:0 auto}
.card{background:#16213e;border-radius:8px;padding:16px;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:4px;border:none;background:#0f3460;color:#fff}
button{width:100%;padding:10px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;margin-top:8px}
button:hover{opacity:.9}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;background:#0f3460;border-radius:4px;text-align:center;cursor:pointer}
.tab.active{background:#e94560}
.hidden{display:none!important}
#debug{position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-family:monospace;font-size:11px;padding:8px;max-height:120px;overflow-y:auto;z-index:9999;border-top:2px solid #e94560}
.status{margin-top:6px;font-size:12px;min-height:18px}
.status.ok{color:#4caf50}
.status.err{color:#f44336}
.status.info{color:#ff9800}
.bot-item{background:#0f3460;padding:10px;border-radius:4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.small-btn{padding:4px 10px;font-size:11px;background:#e94560;border:none;border-radius:4px;color:#fff;cursor:pointer}
</style>
</head>
<body>

<h1 style="margin-bottom:16px;text-align:center">🤖 Bot SaaS</h1>

<div id="debug">[DEBUG] Loading...</div>

<!-- AUTH -->
<div id="authScreen">
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="t-login">Login</div>
      <div class="tab" id="t-register">Register</div>
    </div>
    <div id="form-login">
      <input type="email" id="in-email" placeholder="Email">
      <input type="password" id="in-pass" placeholder="Password">
      <button id="btn-login">LOGIN</button>
    </div>
    <div id="form-register" class="hidden">
      <input type="email" id="reg-email" placeholder="Email">
      <input type="password" id="reg-pass" placeholder="Password (6+ chars)">
      <button id="btn-register">CREATE ACCOUNT</button>
    </div>
    <div id="auth-msg" class="status"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div>
      <div style="font-size:12px;color:#aaa">Logged in as</div>
      <div id="user-email" style="font-weight:600">--</div>
    </div>
    <button id="btn-logout" style="width:auto;padding:6px 14px;font-size:12px">Logout</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="t-bots">My Bots</div>
    <div class="tab" id="t-add">+ Add Bot</div>
    <div class="tab" id="t-settings">Settings</div>
  </div>

  <div id="sec-bots" class="card">
    <div id="bots-list"><div style="color:#aaa;font-size:13px">Loading bots...</div></div>
  </div>

  <div id="sec-add" class="card hidden">
    <input type="text" id="add-name" placeholder="Bot Name">
    <input type="password" id="add-token" placeholder="Discord Bot Token">
    <div style="font-size:11px;color:#aaa;margin-bottom:6px">Token stored in Supabase (RLS-protected)</div>
    <button id="btn-add">CONNECT BOT</button>
    <div id="add-msg" class="status"></div>
  </div>

  <div id="sec-settings" class="card hidden">
    <div style="color:#aaa;font-size:13px">Select a bot from My Bots to edit settings.</div>
  </div>
</div>

<script>
// ─── DEBUG ───
const dbg = document.getElementById('debug');
function log(msg) {
  const line = document.createElement('div');
  line.textContent = '> ' + msg;
  dbg.appendChild(line);
  dbg.scrollTop = dbg.scrollHeight;
}
log('Script loaded');

// ─── SUPABASE ───
const SUPABASE_URL = 'https://tdawmkgedbxbjkctylld.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkYXdta2dlZGJ4YmprY3R5bGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTYzMjQsImV4cCI6MjEwMTY5MjMyNH0.HiZBhR1vK2jHn0m-xYakrfHIym44rvsSuAt7UAjeXoo';

log('Supabase URL: ' + SUPABASE_URL);

let supabase = null;
try {
  if (!window.supabase) {
    log('ERROR: Supabase CDN not loaded! Check internet.');
  } else {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    log('Supabase client created');
  }
} catch (e) {
  log('FATAL: ' + e.message);
}

let currentUser = null;
let botsCache = [];
let currentBotId = null;

// ─── UI HELPERS ───
function show(id, visible) {
  document.getElementById(id).classList.toggle('hidden', !visible);
}
function msg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'status ' + (type || '');
}

// ─── AUTH ───
async function doLogin() {
  log('Login clicked');
  const email = document.getElementById('in-email').value.trim();
  const pass = document.getElementById('in-pass').value;
  if (!email || !pass) return msg('auth-msg', 'Enter email and password', 'err');
  msg('auth-msg', 'Logging in...', 'info');
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
    log('signIn result: error=' + (error ? error.message : 'none'));
    if (error) return msg('auth-msg', error.message, 'err');
    if (!data.user) return msg('auth-msg', 'No user returned', 'err');
    enterApp(data.user);
  } catch (e) {
    log('Login exception: ' + e.message);
    msg('auth-msg', 'Error: ' + e.message, 'err');
  }
}

async function doRegister() {
  log('Register clicked');
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!email || !pass) return msg('auth-msg', 'Enter email and password', 'err');
  if (pass.length < 6) return msg('auth-msg', 'Password must be 6+ chars', 'err');
  msg('auth-msg', 'Creating account...', 'info');
  try {
    const { data, error } = await supabase.auth.signUp({ email, password: pass });
    log('signUp result: error=' + (error ? error.message : 'none') + ' user=' + (data.user ? 'yes' : 'no') + ' session=' + (data.session ? 'yes' : 'no'));
    if (error) return msg('auth-msg', error.message, 'err');
    if (data.session) {
      msg('auth-msg', 'Logged in!', 'ok');
      enterApp(data.user);
    } else {
      msg('auth-msg', 'Account created! Check email or try logging in.', 'ok');
    }
  } catch (e) {
    log('Register exception: ' + e.message);
    msg('auth-msg', 'Error: ' + e.message, 'err');
  }
}

async function doLogout() {
  await supabase.auth.signOut();
  location.reload();
}

function enterApp(user) {
  log('Entering app as ' + user.email);
  currentUser = user;
  document.getElementById('user-email').textContent = user.email;
  show('authScreen', false);
  show('appScreen', true);
  loadBots();
}

// ─── BOTS ───
async function loadBots() {
  log('Loading bots for user ' + currentUser.id);
  try {
    const { data, error } = await supabase.from('user_bots').select('*').eq('user_id', currentUser.id).order('created_at', {ascending:false});
    log('loadBots: error=' + (error ? error.message : 'none') + ' count=' + (data ? data.length : 0));
    if (error) {
      document.getElementById('bots-list').innerHTML = '<div style="color:#f44336">Error: ' + error.message + '</div>';
      return;
    }
    botsCache = data || [];
    const list = document.getElementById('bots-list');
    if (!botsCache.length) {
      list.innerHTML = '<div style="color:#aaa;font-size:13px">No bots yet. Click "+ Add Bot" to connect one.</div>';
      return;
    }
    list.innerHTML = botsCache.map(b => `
      <div class="bot-item">
        <div>
          <div style="font-weight:600">${b.bot_name || 'Unnamed'}</div>
          <div style="font-size:11px;color:#aaa">${b.is_active ? '🟢' : '🔴'} ${(b.bot_id||'').slice(0,8)}...</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="small-btn" onclick="toggleBot('${b.id}', ${!b.is_active})">${b.is_active ? 'Pause' : 'Resume'}</button>
          <button class="small-btn" onclick="deleteBot('${b.id}')">Delete</button>
          <button class="small-btn" onclick="openSettings('${b.id}')" style="background:#533483">Edit</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    log('loadBots exception: ' + e.message);
    document.getElementById('bots-list').innerHTML = '<div style="color:#f44336">Exception: ' + e.message + '</div>';
  }
}

async function addBot() {
  log('Add bot clicked');
  const name = document.getElementById('add-name').value.trim();
  const token = document.getElementById('add-token').value.trim();
  if (!token) return msg('add-msg', 'Token required', 'err');
  msg('add-msg', 'Validating with Discord...', 'info');
  try {
    const resp = await fetch('https://discord.com/api/v10/oauth2/applications/@me', {
      headers: { 'Authorization': 'Bot ' + token }
    });
    log('Discord validation: HTTP ' + resp.status);
    if (!resp.ok) throw new Error('Invalid token (HTTP ' + resp.status + ')');
    const app = await resp.json();
    const botId = app.id;
    const botName = (app.bot && app.bot.username) || name || 'Bot';
    log('Discord app: ' + botName + ' id=' + botId);

    msg('add-msg', 'Saving to Supabase...', 'info');
    const { error } = await supabase.from('user_bots').insert({
      user_id: currentUser.id,
      bot_id: botId,
      bot_name: botName,
      discord_token: token,
      is_active: true,
      settings: {}
    });
    if (error) throw error;
    msg('add-msg', 'Connected ' + botName + '!', 'ok');
    document.getElementById('add-token').value = '';
    document.getElementById('add-name').value = '';
    setTimeout(() => { switchTab('bots'); loadBots(); }, 600);
  } catch (e) {
    log('addBot exception: ' + e.message);
    msg('add-msg', e.message, 'err');
  }
}

async function toggleBot(id, active) {
  await supabase.from('user_bots').update({ is_active: active }).eq('id', id).eq('user_id', currentUser.id);
  loadBots();
}

async function deleteBot(id) {
  if (!confirm('Delete?')) return;
  await supabase.from('user_bots').delete().eq('id', id).eq('user_id', currentUser.id);
  loadBots();
}

function openSettings(botId) {
  currentBotId = botId;
  switchTab('settings');
  const bot = botsCache.find(b => b.id === botId);
  if (!bot) return;
  const s = bot.settings || {};
  document.getElementById('sec-settings').innerHTML = `
    <div style="margin-bottom:10px;font-size:13px">Editing: <b>${bot.bot_name}</b></div>
    <label>Personality</label>
    <textarea id="s-personality" rows="3">${s.personality || ''}</textarea>
    <label>Provider</label>
    <select id="s-provider">
      <option value="auto" ${(s.provider||'auto')==='auto'?'selected':''}>Auto</option>
      <option value="gemini" ${s.provider==='gemini'?'selected':''}>Gemini</option>
      <option value="groq" ${s.provider==='groq'?'selected':''}>Groq</option>
      <option value="openrouter" ${s.provider==='openrouter'?'selected':''}>OpenRouter</option>
      <option value="huggingface" ${s.provider==='huggingface'?'selected':''}>Hugging Face</option>
    </select>
    <label>Gemini Model</label><input type="text" id="s-gemini" value="${s.gemini_model||'gemini-2.0-flash'}">
    <label>Groq Model</label><input type="text" id="s-groq" value="${s.groq_model||'llama-3.3-70b-versatile'}">
    <label>OpenRouter Model</label><input type="text" id="s-or" value="${s.model||'openrouter/free'}">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div><label>Max Tokens</label><input type="number" id="s-tokens" value="${s.max_tokens||800}"></div>
      <div><label>Temp</label><input type="number" id="s-temp" step="0.1" value="${s.temperature||0.7}"></div>
      <div><label>Cooldown</label><input type="number" id="s-cd" value="${s.cooldown_seconds||10}"></div>
    </div>
    <label><input type="checkbox" id="s-vision" ${s.vision_enabled?'checked':''}> Vision</label><br>
    <label><input type="checkbox" id="s-tts" ${s.tts_enabled?'checked':''}> TTS</label><br>
    <label><input type="checkbox" id="s-search" ${s.auto_search!==false?'checked':''}> Auto Search</label><br>
    <label><input type="checkbox" id="s-memory" ${s.user_memory_enabled!==false?'checked':''}> User Memory</label><br>
    <label><input type="checkbox" id="s-openchat" ${s.open_chat_enabled?'checked':''}> Open Chat</label><br>
    <button id="btn-save">SAVE SETTINGS</button>
    <div id="save-msg" class="status"></div>
  `;
  document.getElementById('btn-save').addEventListener('click', saveSettings);
}

async function saveSettings() {
  if (!currentBotId) return;
  try {
    const payload = {
      personality: document.getElementById('s-personality').value,
      provider: document.getElementById('s-provider').value,
      gemini_model: document.getElementById('s-gemini').value,
      groq_model: document.getElementById('s-groq').value,
      model: document.getElementById('s-or').value,
      max_tokens: parseInt(document.getElementById('s-tokens').value),
      temperature: parseFloat(document.getElementById('s-temp').value),
      cooldown_seconds: parseInt(document.getElementById('s-cd').value),
      vision_enabled: document.getElementById('s-vision').checked,
      tts_enabled: document.getElementById('s-tts').checked,
      auto_search: document.getElementById('s-search').checked,
      user_memory_enabled: document.getElementById('s-memory').checked,
      open_chat_enabled: document.getElementById('s-openchat').checked,
    };
    const { error } = await supabase.from('user_bots').update({ settings: payload }).eq('id', currentBotId).eq('user_id', currentUser.id);
    if (error) return msg('save-msg', error.message, 'err');
    msg('save-msg', 'Saved! Syncs to device in ~30s.', 'ok');
    loadBots();
  } catch (e) {
    msg('save-msg', e.message, 'err');
  }
}

// ─── TABS ───
function switchTab(name) {
  // auth tabs
  if (name === 'login') {
    document.getElementById('t-login').classList.add('active');
    document.getElementById('t-register').classList.remove('active');
    show('form-login', true);
    show('form-register', false);
  } else if (name === 'register') {
    document.getElementById('t-login').classList.remove('active');
    document.getElementById('t-register').classList.add('active');
    show('form-login', false);
    show('form-register', true);
  } else {
    // app sections
    show('sec-bots', name === 'bots');
    show('sec-add', name === 'add');
    show('sec-settings', name === 'settings');
    document.getElementById('t-bots').classList.toggle('active', name === 'bots');
    document.getElementById('t-add').classList.toggle('active', name === 'add');
    document.getElementById('t-settings').classList.toggle('active', name === 'settings');
  }
}

// ─── EVENT LISTENERS ───
document.getElementById('t-login').addEventListener('click', () => switchTab('login'));
document.getElementById('t-register').addEventListener('click', () => switchTab('register'));
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('btn-register').addEventListener('click', doRegister);
document.getElementById('btn-logout').addEventListener('click', doLogout);
document.getElementById('t-bots').addEventListener('click', () => switchTab('bots'));
document.getElementById('t-add').addEventListener('click', () => switchTab('add'));
document.getElementById('t-settings').addEventListener('click', () => switchTab('settings'));
document.getElementById('btn-add').addEventListener('click', addBot);

// ─── INIT ───
(async () => {
  log('INIT: checking session...');
  try {
    if (!supabase) return log('INIT: Supabase not available');
    const { data: { user }, error } = await supabase.auth.getUser();
    log('INIT: user=' + (user ? user.email : 'none') + ' error=' + (error ? error.message : 'none'));
    if (user) enterApp(user);
  } catch (e) {
    log('INIT exception: ' + e.message);
  }
})();
</script>
</body>
</html>

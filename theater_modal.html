  <!-- FULLSCREEN CINEMA / THEATER OVERLAY -->
  <div class="theater-cinema-overlay" id="watchTogetherTheaterModal">
    <!-- Responsive Floating Top Bar -->
    <div class="theater-top-bar">
      <!-- Row 1: Header Badge + Action Buttons -->
      <div class="theater-top-row1">
        <div style="display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden;">
          <span style="font-size:14px; flex-shrink:0;">🍿</span>
          <span style="font-size:12px; font-weight:700; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="theaterBotBadge">Co-Watching with Yuna</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
          <button type="button" class="chat-top-btn" id="theaterScreenFeedBtn" onclick="toggleTheaterScreenFeed()" style="padding:4px 10px; font-size:11px; border-radius:14px; background:rgba(229,192,123,0.15); color:#e5c07b; border:1px solid rgba(229,192,123,0.3);" title="Stream screen/tab to AI">🖥️ Screen Feed</button>
          <button type="button" class="chat-top-btn" onclick="closeWatchTogetherTheater()" style="padding:4px 10px; font-size:11px; border-radius:14px;">✕ Close</button>
        </div>
      </div>
      <!-- Row 2: Search Input & Media Buttons -->
      <div class="theater-top-row2">
        <input type="text" class="composer-input" id="theaterYoutubeUrlInput" placeholder="Paste YouTube link (youtu.be/...) or Video URL" onkeydown="if(event.key==='Enter') loadTheaterYouTubeVideo()" style="background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:5px 12px; font-size:11.5px; flex:1; min-width:0; color:#fff;">
        <button type="button" class="btn-primary" onclick="loadTheaterYouTubeVideo()" style="padding:5px 12px; font-size:11px; border-radius:16px; white-space:nowrap; flex-shrink:0;">▶ Play</button>
        <input type="file" id="theaterFileInput" accept="video/*" style="display:none;" onchange="loadTheaterLocalFile(event)">
        <button type="button" class="chat-top-btn" onclick="$('theaterFileInput').click()" style="padding:5px 9px; font-size:11px; border-radius:16px; white-space:nowrap; flex-shrink:0;" title="Open local video file">📁 File</button>
      </div>
    </div>

    <!-- Main Video Screen -->
    <div class="theater-screen-wrapper">
      <iframe class="theater-iframe" id="theaterIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      <video class="theater-iframe" id="theaterHtml5Video" style="display:none; width:100%; height:100%; object-fit:contain;" controls autoplay playsinline></video>
    </div>

    <!-- Floating Cinematic Companion HUD -->
    <div class="theater-companion-hud">
      <!-- Typewriter Speech Bubble -->
      <div class="theater-reaction-bubble" id="theaterReactionBubble" title="Click to fast-forward text">
        <span style="font-size:16px; flex-shrink:0;">🍿</span>
        <div id="theaterReactionText" class="theater-reaction-text">Ready to watch together! Paste a YouTube link or choose a video above.</div>
      </div>

      <!-- Quick Chat Input Box -->
      <form class="theater-type-form" onsubmit="sendTheaterUserMessage(event)">
        <input type="text" class="theater-chat-input" id="theaterChatInput" placeholder="Talk to companion (or ask about this scene)..." autocomplete="off">
        <button type="submit" class="theater-send-btn">Send ➔</button>
      </form>

      <!-- Action & Live Vision Status Bar -->
      <div style="display:flex; align-items:center; justify-content:space-between; width:100%; border-top:1px solid rgba(255,255,255,0.06); padding-top:4px; font-size:10.5px; flex-wrap:wrap; gap:4px;">
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <span style="color:var(--accent); font-weight:600;" id="theaterVideoStatus">● AI Ingesting Video Stream</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:4px; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="theaterAutoChimeIn" checked>
            <span>Auto-Chime</span>
          </label>
          <button type="button" class="btn-primary" onclick="askCompanionAboutVideo()" style="padding:2px 9px; font-size:10.5px; background:rgba(229,192,123,0.15); color:#e5c07b; border:1px solid rgba(229,192,123,0.3); border-radius:6px;">💬 Ask Thoughts</button>
        </div>
      </div>
    </div>
  </div>
